services:
  # 0. Servis Database PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: coe_db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: coe_db
      POSTGRES_USER: coe_user
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coe_user -d coe_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 1. Servis Backend Laravel
  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: coe_backend
    ports:
      - "8000:8000"
    volumes:
      - ./src/backend:/var/www/backend
      - /var/www/backend/vendor
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=coe_db
      - DB_USERNAME=coe_user
      - DB_PASSWORD=secret
      # Konfigurasi Sambungan Redis untuk Cache & State
      - CACHE_STORE=redis
      - REDIS_CLIENT=predis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 2. Servis Frontend Nuxt
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: coe_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
    environment:
      - NUXT_PUBLIC_API_BASE=http://localhost:8000/api
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    depends_on:
      - backend

  # 3. Servis In-Memory Cache & State (Redis)
  redis:
    image: redis:7-alpine
    container_name: coe_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata: